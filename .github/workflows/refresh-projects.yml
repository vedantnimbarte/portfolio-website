name: Refresh projects

# data/projects.json and data/github.json are committed build-time snapshots
# of the GitHub profile. This keeps stars and timestamps from going stale without anyone
# remembering to run `npm run fetch:projects` by hand.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # gh is preinstalled on ubuntu-latest. Every featured repo is public, so
      # the default token is enough - no PAT needed.
      - name: Fetch repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-projects.mjs

      # Achievements and the contribution total, read from the public profile.
      - name: Fetch profile achievements
        run: node scripts/fetch-github.mjs

      # The script throws on incomplete data, so a bad fetch fails the run
      # instead of committing garbage.
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data assets/github)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/github
          git commit -m "chore: refresh GitHub snapshot"
          git push
